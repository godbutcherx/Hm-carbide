        .cert-card { position: relative; overflow: hidden; }
        /* Seal: Uhren-Lünette, Stahl, einziges Rot ist das Schweizer Kreuz */
        .swiss-badge {
            --seal-steel: #aab1ba; --seal-face: #15181e; --seal-face-hi: #232831;
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: var(--bg2); opacity: 0; transition: opacity 0.5s ease;
        }
        .seal { width: min(72%, 270px); height: auto; overflow: visible; transform: scale(0.94); opacity: 0; transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease; }

        .seal-bezel { stroke: var(--seal-steel); transform-origin: 100px 100px; transition: transform 1.6s cubic-bezier(0.22, 1, 0.36, 1); }
        .seal-inner { stroke: var(--seal-steel); stroke-width: 0.8; }
        .seal-hair { fill: none; stroke: var(--seal-steel); stroke-width: 0.35; opacity: 0.5; }
        .seal-text { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 10.5px; letter-spacing: 3.4px; fill: var(--seal-steel); }
        .seal-text--b { font-size: 10px; letter-spacing: 4.4px; }
        .seal-text textPath { font: inherit; letter-spacing: inherit; }
        .seal-flag { fill: #d52b1e; }
        .cert-card:hover .swiss-badge, .cert-card:focus-within .swiss-badge { opacity: 1; }
        .cert-card:hover .seal, .cert-card:focus-within .seal { transform: scale(1); opacity: 1; }
        .cert-card:hover .seal-bezel, .cert-card:focus-within .seal-bezel { transform: rotate(30deg); }
        [data-theme="light"] .swiss-badge { --seal-steel: #5d646e; --seal-face: #eef0f3; --seal-face-hi: #ffffff; }
        @media (prefers-reduced-motion: reduce) { .seal, .seal-bezel { transition: opacity 0.3s; transform: none !important; } }
        .cert-card:focus-visible { outline: 2px solid var(--secondary); outline-offset: 3px; }
