<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zertifikate & Qualität | HM Carbide Swiss GmbH</title>
    <meta name="description" content="Qualität ist unser Versprechen. Sehen Sie unsere ISO 9001:2015 Zertifizierung und unser Engagement für Schweizer Originalqualität.">
    <link rel="canonical" href="https://www.hmcarbide.ch/certificates.html">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.hmcarbide.ch/certificates.html">
    <meta property="og:title" content="Zertifikate & Schweizer Qualität - HM Carbide">
    <meta property="og:description" content="Unsere Verpflichtung zu Qualität und Präzision. ISO 9001:2015 zertifiziert. Original Schweizer Qualität.">
    <meta property="og:image" content="https://www.hmcarbide.ch/images/meta.jpg">
    <meta itemprop="image" content="https://www.hmcarbide.ch/images/meta.jpg">
    <meta name="twitter:image" content="https://www.hmcarbide.ch/images/meta.jpg">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@400;600;700;800;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpg" href="images/logo.jpg">
    <style>
        .cert-card { position: relative; overflow: hidden; }

        /* Normal halde rozet gizli */
        .swiss-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: rgba(20,20,30,0.82);
            backdrop-filter: blur(4px);
        }
        .swiss-badge svg {
            width: 160px;
            height: 160px;
            filter: drop-shadow(0 6px 24px rgba(200,16,46,0.5));
            transform: scale(0.8) rotate(-10deg);
            transition: transform 0.45s cubic-bezier(.34,1.56,.64,1);
        }

        /* Hover'da rozet belirir */
        .cert-card:hover .swiss-badge {
            opacity: 1;
        }
        .cert-card:hover .swiss-badge svg {
            transform: scale(1) rotate(0deg);
        }
    </style>
</head>
<body>
    <div class="page-header-section">
        <h1 class="page-title reveal" data-i18n="nav_certs">ZERTIFIKATE</h1>
    </div>
    <div class="cert-container">
        <div class="cert-card reveal">
            <h3>ISO 9001:2015</h3>
            <p>Quality Management System</p>
        </div>
        <div class="cert-card reveal">
            <h3 data-i18n="swiss_title">SCHWEIZER QUALITÄT</h3>
            <p data-i18n="swiss_desc">Original Qualität</p>
            <div class="swiss-badge">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <path id="topArc" d="M 20,100 A 80,80 0 0,1 180,100"/>
                        <path id="botArc" d="M 30,115 A 72,72 0 0,0 170,115"/>
                    </defs>
                    <!-- Dış kesik çizgi halkası -->
                    <circle cx="100" cy="100" r="95" fill="none" stroke="#c8102e" stroke-width="2" stroke-dasharray="5 3" opacity="0.6"/>
                    <!-- İkinci halka -->
                    <circle cx="100" cy="100" r="88" fill="none" stroke="#c8102e" stroke-width="0.8" opacity="0.4"/>
                    <!-- Ana kırmızı daire -->
                    <circle cx="100" cy="100" r="78" fill="#c8102e"/>
                    <!-- İnce iç halka -->
                    <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
                    <!-- İsviçre haçı -->
                    <rect x="85" y="56" width="30" height="88" rx="4" fill="white"/>
                    <rect x="56" y="85" width="88" height="30" rx="4" fill="white"/>
                    <!-- Üst yay yazısı -->
                    <text font-family="Montserrat,sans-serif" font-size="13" font-weight="800" fill="#c8102e" letter-spacing="3">
                        <textPath href="#topArc" startOffset="50%" text-anchor="middle">SWISS QUALITY</textPath>
                    </text>
                    <!-- Alt yay yazısı -->
                    <text font-family="Montserrat,sans-serif" font-size="11" font-weight="600" fill="#c8102e" letter-spacing="2">
                        <textPath href="#botArc" startOffset="50%" text-anchor="middle">GUARANTEED</textPath>
                    </text>
                    <!-- Yıldızlar sol ve sağ -->
                    <text x="22" y="104" text-anchor="middle" font-size="10" fill="#c8102e">★</text>
                    <text x="178" y="104" text-anchor="middle" font-size="10" fill="#c8102e">★</text>
                </svg>
            </div>
        </div>
    </div>
    <script src="layout.js"></script>
    <script src="script.js"></script>
    <script src="background.js"></script>
</body>
</html>
