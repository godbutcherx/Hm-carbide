<body class="inner">

    <div class="contact-grid">
        <div class="contact-info">
            <h2 class="contact-h" data-i18n="contact_info_title">Kontaktinformationen</h2>
            <ul class="contact-list">
                <li><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span><strong>HM Carbide Swiss GmbH</strong><br>Müligässli 1, 8598 Bottighofen<br><span data-i18n="country_ch">Schweiz</span></span></li>

        </div>

        <div class="contact-form">
            <h2 class="contact-h" data-i18n="form_title">Nachricht senden</h2>
            <form id="contact-form">
                <!-- Honeypot: botlar doldurur, insanlar görmez -->
                <input type="text" name="website" id="honeypot" tabindex="-1" autocomplete="off" style="position:absolute; left:-9999px; opacity:0; height:0; width:0;">
                <label class="field"><span data-i18n="ph_name">Name</span><input type="text" name="name" id="user_name" required maxlength="100" autocomplete="name"></label>
                <label class="field"><span data-i18n="ph_email">E-Mail</span><input type="email" name="email" id="user_email" required maxlength="150" autocomplete="email"></label>
                <label class="field"><span data-i18n="lbl_message">Nachricht</span><textarea name="message" id="user_message" rows="6" required maxlength="2000"></textarea></label>
                <button type="submit" id="submit-btn" class="btn" data-i18n="form_btn">Nachricht senden</button>
            </form>
        </div>
    </div>
