<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontakt | HM Carbide Swiss GmbH</title>
    <meta name="description" content="Haben Sie Fragen zu Hartmetallstäben oder möchten Sie ein Angebot? Kontaktieren Sie HM Carbide Swiss GmbH in Bottighofen – per Telefon, E-Mail oder Formular.">
    <link rel="canonical" href="https://www.hmcarbide.ch/contact.html">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.hmcarbide.ch/contact.html">
    <meta property="og:title" content="Kontaktieren Sie uns - HM Carbide Swiss GmbH">
    <meta property="og:description" content="Haben Sie Fragen zu Hartmetallstäben? Kontaktieren Sie HM Carbide Swiss GmbH – Ihr direkter Draht zu Schweizer Präzision.">
    <meta property="og:image" content="https://www.hmcarbide.ch/images/meta.jpg">
    <meta itemprop="image" content="https://www.hmcarbide.ch/images/meta.jpg">
    <meta name="twitter:image" content="https://www.hmcarbide.ch/images/meta.jpg">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@400;600;700;800;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo.jpg">
    <link rel="apple-touch-icon" href="images/logo.jpg">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ContactPage",
          "@id": "https://www.hmcarbide.ch/contact.html#webpage",
          "url": "https://www.hmcarbide.ch/contact.html",
          "name": "Kontakt – HM Carbide Swiss GmbH",
          "description": "Kontaktieren Sie HM Carbide Swiss GmbH in Bottighofen, Schweiz. Anfragen zu Hartmetallstäben und Bestellungen.",
          "publisher": { "@id": "https://www.hmcarbide.ch/#organization" }
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://www.hmcarbide.ch/#localbusiness",
          "name": "HM Carbide Swiss GmbH",
          "url": "https://www.hmcarbide.ch",
          "telephone": "+41 76 290 91 93",
          "email": "info@hmcarbide.ch",
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 47.63948,
            "longitude": 9.21132
          },
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Müligässli 1",
            "addressLocality": "Bottighofen",
            "postalCode": "8598",
            "addressCountry": "CH"
          },
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "telephone": "+41 76 290 91 93",
              "contactType": "sales",
              "availableLanguage": ["German", "English", "Turkish"]
            },
            {
              "@type": "ContactPoint",
              "email": "info@hmcarbide.ch",
              "contactType": "customer support"
            }
          ]
        }
      ]
    }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js" integrity="sha384-rRoXxn2yHlrZYB587Ki9RO1tONhLdM6XfORg7Rw4uwH4/Fh/5nP7IUX91bkaKUgs" crossorigin="anonymous"></script>
</head>
<body>
    <div class="page-header-section">
        <h1 class="page-title reveal" data-i18n="nav_contact">KONTAKT</h1>
    </div>

    <div class="contact-wrap reveal" style="display:flex; flex-wrap:wrap; justify-content:center; padding:15px 5% 60px; gap:40px;">
        <div class="left-panel" style="flex:1; min-width:300px;">
            <div class="info-box" style="background:var(--bg2); padding:30px; border-radius:8px; border:1px solid var(--border); margin-bottom:20px;">
                <h3 style="margin-bottom:20px; color:white;" data-i18n="contact_info_title">Kontaktinformationen</h3>
                <div style="margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:15px;"><p><strong>HM Carbide Swiss GmbH</strong></p><p>📍 Müligässli 1, 8598 Bottighofen, Switzerland</p></div>
                <div style="margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:15px;"><p>📞 <a href="tel:+41762909193" style="font-weight:bold;">+41 76 290 91 93</a></p></div>
                <div><p>✉️ <a href="mailto:info@hmcarbide.ch" style="color:#d93025;">info@hmcarbide.ch</a></p></div>
            </div>
            <div class="map-box" style="width:100%; height:300px; border-radius:8px; overflow:hidden;"><iframe src="https://maps.google.com/maps?q=M%C3%BClig%C3%A4ssli%201%2C%208598%20Bottighofen&t=&z=13&ie=UTF8&iwloc=&output=embed" style="width:100%; height:100%; border:0;" loading="lazy"></iframe></div>
        </div>
        
        <div class="form-box" style="flex:1; min-width:300px; background:var(--bg2); padding:40px; border-radius:8px; border:1px solid var(--border); border-top:4px solid var(--secondary);">
            <h2 style="color:white; margin-bottom:20px;" data-i18n="form_title">Nachricht Senden</h2>
            
            <form id="contact-form" style="display:flex; flex-direction:column; gap:20px;">
                <!-- Honeypot: botlar doldurur, insanlar görmez -->
                <input type="text" name="website" id="honeypot" tabindex="-1" autocomplete="off" style="position:absolute; left:-9999px; opacity:0; height:0; width:0;">
                <input type="text" name="name" id="user_name" placeholder="Name" required maxlength="100" data-i18n-ph="ph_name" style="padding:15px; border:1px solid rgba(255,255,255,0.15); background:#2a2f3d; color:white; border-radius:6px;">
                <input type="email" name="email" id="user_email" placeholder="E-Mail" required maxlength="150" data-i18n-ph="ph_email" style="padding:15px; border:1px solid rgba(255,255,255,0.15); background:#2a2f3d; color:white; border-radius:6px;">
                <textarea name="message" id="user_message" rows="5" placeholder="Ihre Nachricht..." required maxlength="2000" data-i18n-ph="ph_message" style="padding:15px; border:1px solid rgba(255,255,255,0.15); background:#2a2f3d; color:white; border-radius:6px;"></textarea>
                <button type="submit" id="submit-btn" class="btn" data-i18n="form_btn">SENDEN</button>
            </form>
        </div>
    </div>

    <script src="layout.js"></script>
    <script src="script.js"></script>
    <script src="background.js"></script>
</body>
</html>
